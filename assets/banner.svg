<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A dark banner with faint horizontal ledger lines across the full background, a large monospace wordmark reading dltslt on the left, a small tracked tagline beneath it reading rooted vision realized form with a wine red middle dot, a thin horizontal rule beneath that, and on the right a minimal abstract mark of two plain vertical bars of different heights sharing a common baseline, one olive green and one wine red.</desc>
